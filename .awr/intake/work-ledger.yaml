  kind: implementation
  status: completed
  priority: P0
  required: true
  goal: intake-goal
  depends_on: [DSH-020, DSH-002]
  acceptance:
  - One click on an uninitialized project starts the run in the background and the user's conversation stays usable.
  - The draft-review step runs in a subagent limited to reading files, calling awr and writing the takeover scope.
  - Goals the material cannot establish are recorded as candidate or needs_confirmation and no question is asked during the run.
  - The receipt lists what was mapped, what was created and what awaits confirmation.
  next_action: Complete DSH-021 with the registered evidence
  "evidence": ["docs/evidence/DSH-021/completion-report.json"]
  "verification": {"evidence_level":"locally_verified"}
